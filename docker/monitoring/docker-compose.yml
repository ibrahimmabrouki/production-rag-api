# The objective is to set up the monitoring lifecycle for the FastAPI application using this docker-compose.yml file. The monitoring lifecycle includes the following components:
# 1. Logging: Capturing and storing logs generated by the FastAPI application in logs/app.log.
# 2. Metrics: Collecting and exposing application metrics for monitoring and analysis.

# Since everything in the app/core/monitoring/directory is already set up, and we have the logger that i using the JSON formatter and handler that writes to logs/app.log, we just need to set up this docker-compose that will send these logs to Grafana Loki for visualization and analysis.

# 1- The first step is define what every service is knowing that this will the final monitoring architecture:
# - Grafana Cloud: This is the cloud-based service that will receive and store the logs sent from the Grafana Alloy service. It provides a web interface for visualizing and analyzing the logs.
# Think of it as the place where your monitoring data ultimately lives and where you visualize/query it.

# - Grafana Alloy: Grafana Alloy is an observability collector/agent. This is a service that reads the logs from the logs/app.log file, adds metadata to them, and sends them to Grafana Cloud over HTTPS. It acts as a bridge between your application logs and Grafana Cloud.
# Note: Alloy is not your monitoring dashboard. It's the collector/forwarder.

# Loki: This is a log aggregation system that is part of Grafana Cloud. It stores and indexes the logs sent from Grafana Alloy, allowing you to query and visualize them in Grafana.
# for example the application produces: { "timestamp": "...", "level": "INFO", "message": "Cache hit", "logger": "production-api" }

#   Your Python Application
#            │
#            ▼
#   Structured JSON Logger
#            │
#            ▼
#       logs/app.log
#            │
#            │
#     Docker volume mount
#            │
#            ▼
#  ┌─────────────────────┐
#  │   Grafana Alloy     │
#  │                     │
#  │ Read log file       │
#  │ Add metadata        │
#  │ Send logs           │
#  └──────────┬──────────┘
#             │
#          HTTPS
#             │
#             ▼
#  ┌─────────────────────┐
#  │   Grafana Cloud     │
#  │                     │
#  │       Loki          │
#  │         │           │
#  │         ▼           │
#  │      Explore        │
#  │         │           │
#  │         ▼           │
#  │    Dashboards       │
#  └─────────────────────┘

# a- logs/app.log: This is where your existing JSON logger writes application logs. evantully logger.py => app.log
# b-config.alloy: This is the configuration file for Grafana Alloy, what it contains are the following: Read this log file, process it, and send it to Grafana Cloud
# It will have three main responsibilities:
# 1. Find the log file
#        ↓
# 2. Read/tail the log file
#        ↓
# 3. Send logs to Grafana Cloud Loki

# The second thing is that we are setting this as Docker for Alloy since we dont want to deal with permissions, path, service configuration, and credential managment issues when it Alloy service is running directly on the host machine
# so we will use Docker to run Grafana Alloy as a container, and we will mount the logs/app.log file from the host machine into the container so that Alloy can read it.

# so In general the application has: C:\projects\production-api\logs\app.log
# and Docker can mount that directory into Alloy container so Alloy can read the logs from that file and send them to Grafana Cloud.
# Conceptually, the flow is like this:
# C:\projects\production-api\logs (Volume mount) => Docker -/var/log/production-api- => Alloy so Alloy can read  /var/log/production-api/app.log

# The following is the complete build:
#                     DEVELOPMENT MACHINE
# ┌─────────────────────────────────────────────────────────┐
# │   Python / FastAPI                                      │
# │        │                                                │
# │        ▼                                                │
# │   Structured JSON Logger                                │
# │        │                                                │
# │        ▼                                                │
# │   logs/app.log                                          │
# │        │                                                │
# │        │ volume mount                                   │
# │        ▼                                                │
# │   ┌───────────────────────────┐                         │
# │   │ Docker                    │                         │
# │   │   ┌───────────────────┐   │                         │
# │   │   │ Grafana Alloy     │   │                         │
# │   │   │                   │   │                         │
# │   │   │ Read → Process    │   │                         │
# │   │   │       → Send      │   │                         │
# │   │   └─────────┬─────────┘   │                         │
# │   └─────────────┼─────────────┘                         │
# │                 │ HTTPS                                 │
# └─────────────────┼───────────────────────────────────────┘
#                   │
#                   ▼
#           ┌──────────────────┐
#           │  Grafana Cloud   │
#           │  Loki            │
#           │    ↓             │
#           │  Explore         │
#           │    ↓             │
#           │  Dashboards      │
#           └──────────────────┘

# This file docker-compose.yml is responsible for Starting the Grafana Alloy container using the image grafana/alloy:latest, and give it access to the application's log directory and Alloy configuration
# docker-compose.yml
#        │
#        ▼
# Alloy container
#        │
#        ├── config.alloy
#        │
#        └── /logs/app.log

# what we need to prepare from Grafana Cloud are:
# GRAFANA_LOKI_URL
# GRAFANA_LOKI_USER
# GRAFANA_LOKI_TOKEN

# then add them to the .env file

# .env
#  ├── Python settings → get_settings()
#  │
#  └── Alloy credentials → Docker → Alloy

# next we need the configuration file for Grafana Alloy:
# app.log
#    ↓
# local.file_match
# Windows:
# production-api/log/app.log
#           ↓ Docker volume
# Alloy container:
# /var/log/production-api/app.log
#    ↓
# loki.source.file
#    ↓
# loki.write
#    ↓
# Grafana Cloud Loki

# lets build the compose file:
# since the compsose file is here: production-api/docker/monitoring/docker-compose.yml
# and the log is here: production-api/log/app.log

# this means: - ../../log:/var/log/production-api:ro => production-api/log => /var/log/production-api

services:
  alloy:
    image: grafana/alloy:latest
    container_name: production-api-alloy
    restart: unless-stopped

    # this will load the environment variables from the .env file located two levels up from the current directory
    #     .env
    #   ↓
    # env_file
    #   ↓
    # Alloy container
    #   ↓
    # sys.env(...)
    #   ↓
    # config.alloy
    env_file:
      - .env

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../../logs:/var/log/production-api:ro

    # these are the commands that will be executed when the container starts, and it will run the Alloy service with the specified configuration file.
    command:
      - run
      - /etc/alloy/config.alloy



#  to make sure of the configuration run the following command in the terminal:
# cd C:\projects\production-api\docker\monitoring 
# then 
# docker compose config

# then we can start the Alloy service by running the following command in the terminal:
# docker compose up -d
# and to check: 
# docker compose config

# to restart:
# docker compose restart alloy


# Grafana Cloud
    # │
    # └── Access Policy
    #       │
    #       └── Logs: Write
    #             │
    #             └── Token
    #                  ↓
    #              .env
    #                  ↓
    #              Alloy
    #                  ↓
    #                Loki