# The Python package is simply the client that allows your application to communicate with the Redis server.

# but before creating the Redis client, we need to configure Redis with Pydantic settings.

# we already have Pydantic settings for the FastAPI application
# .env
#  ↓
# Pydantic Settings
#  ↓
# Redis configuration
#  ↓
# Redis client

# Note: later on for production we just need to change the Local Redis to Production / Redis Cloud easily with changing the .env file

# these what are needed to be added to the .env file
# REDIS_URL
# REDIS_MAX_CONNECTIONS
# REDIS_SOCKET_TIMEOUT
# REDIS_SOCKET_CONNECT_TIMEOUT
# REDIS_HEALTH_CHECK_INTERVAL

# REDIS_URL=redis://localhost:6379/0
# this for local development: later on it will be ===> rediss://username:password@your-production-redis:6380/0
# Note: redis:// means normal Redis coonnection, while rediss:// means a secure Redis connection using SSL/TLS.
# why Redis DB 0? Redis supports multiple databases, numbered from 0 to 15 by default. In this case, we are using database 0, which is the default database for Redis. You can change the number if you want to use a different database.

# REDIS_MAX_CONNECTIONS=20
# Controls how many Redis connections your application can maintain in its pool.
# We can tune this later based on actual traffic.

# REDIS_SOCKET_TIMEOUT=5
# How long the client waits for Redis to respond

# REDIS_SOCKET_CONNECT_TIMEOUT=5
# How long the client waits to establish a connection to Redis

# REDIS_HEALTH_CHECK_INTERVAL=30
# Allows the Redis client to periodically check whether an existing connection is still alive.


